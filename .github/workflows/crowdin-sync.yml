name: Sync translations from Crowdin

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest

    steps:
      - name: Check Crowdin credentials
        id: crowdin-credentials
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          if [[ -n "$CROWDIN_PROJECT_ID" && -n "$CROWDIN_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Crowdin sync skipped because repository credentials are not configured."
          fi

      - name: Checkout
        if: steps.crowdin-credentials.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: crowdin action
        if: steps.crowdin-credentials.outputs.configured == 'true'
        uses: crowdin/github-action@9af557de76d70c480f88065d336f445a362f402b # v3.1.0
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: translations
          create_pull_request: true
          pull_request_title: 'chore(i18n): update translations'
          pull_request_base_branch_name: 'dev'
          config: ./crowdin.yml
          skip_ref_checkout: true
          crowdin_branch_name: dev
          download_translations_args: -e af
          pull_request_body: |
            ## 🌐 New translations from Crowdin

            This PR contains the latest translations from [Crowdin](https://crowdin.com).


            ### 🔍 Translation Status
            Check the current translation status at [i18n.remna.st](https://i18n.remna.st)

            ---
            *Automated by [Crowdin GitHub Action](https://github.com/crowdin/github-action)*
          commit_message: 'chore(i18n): update translations'
        env:
          # A classic GitHub Personal Access Token with the 'repo' scope selected (the user should have write access to the repository).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # A numeric ID, found at https://crowdin.com/project/<projectName>/tools/api
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}

          # Visit https://crowdin.com/settings#api-key to create this token
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
